<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="gasto-pov-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#140D07" />
      <stop offset="60%" stop-color="#24150B" />
      <stop offset="100%" stop-color="#3D1C08" />
    </linearGradient>
    <radialGradient id="bokeh-warm" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ED500A" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ED500A" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="bokeh-light" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEF3C7" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="wood-desk" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#451A03" />
      <stop offset="50%" stop-color="#78350F" />
      <stop offset="100%" stop-color="#270E02" />
    </linearGradient>
    <linearGradient id="screen-pos" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0E14" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
  </defs>

  <!-- Fondo: Restaurante con bokeh y luces desenfocadas (POV Depth of Field) -->
  <rect width="600" height="450" fill="url(#gasto-pov-bg)" />

  <!-- Bokeh orbs de ambiente -->
  <circle cx="120" cy="80" r="45" fill="url(#bokeh-warm)" />
  <circle cx="280" cy="60" r="30" fill="url(#bokeh-light)" />
  <circle cx="480" cy="110" r="60" fill="url(#bokeh-warm)" />
  <circle cx="520" cy="50" r="35" fill="url(#bokeh-light)" />
  <circle cx="80" cy="160" r="25" fill="url(#bokeh-light)" />

  <!-- Siluetas suaves de estanterías y lámparas de fondo -->
  <line x1="280" y1="0" x2="280" y2="70" stroke="#78350F" stroke-width="2" opacity="0.5" />
  <ellipse cx="280" cy="70" rx="8" ry="12" fill="#FBBF24" opacity="0.7" />
  <line x1="480" y1="0" x2="480" y2="90" stroke="#78350F" stroke-width="2" opacity="0.5" />
  <ellipse cx="480" cy="90" rx="10" ry="14" fill="#ED500A" opacity="0.8" />

  <!-- Mostrador de madera en primer plano (Perspectiva POV) -->
  <path d="M 0 240 L 600 240 L 600 450 L 0 450 Z" fill="url(#wood-desk)" />
  <line x1="0" y1="240" x2="600" y2="240" stroke="#B45309" stroke-width="3" />
  <line x1="0" y1="246" x2="600" y2="246" stroke="#000000" stroke-width="2" opacity="0.4" />

  <!-- Objeto de apoyo 1: Hamburguesa Gourmet & Papas en cesta (Foreground) -->
  <g transform="translate(40, 260)">
    <!-- Plato / Bandeja de madera -->
    <ellipse cx="70" cy="110" rx="75" ry="25" fill="#1C1917" opacity="0.8" />
    <ellipse cx="70" cy="105" rx="70" ry="22" fill="#292524" />
    
    <!-- Hamburguesa en detalle -->
    <!-- Pan inferior -->
    <ellipse cx="55" cy="95" rx="35" ry="12" fill="#D97706" />
    <!-- Carne jugosa -->
    <rect x="22" y="80" width="66" height="14" rx="6" fill="#1C1917" />
    <!-- Queso derretido naranja NEGOVA -->
    <path d="M 20 84 L 88 84 L 82 94 L 70 88 L 50 94 L 35 88 L 22 92 Z" fill="#ED500A" />
    <!-- Tomate & lechuga -->
    <rect x="24" y="74" width="62" height="7" rx="3" fill="#DC2626" />
    <path d="M 18 73 Q 35 80 50 73 Q 65 80 92 73" stroke="#10B981" stroke-width="5" fill="none" stroke-linecap="round" />
    <!-- Pan superior con semillas -->
    <path d="M 22 72 C 22 45, 88 45, 88 72 Z" fill="#F59E0B" />
    <ellipse cx="40" cy="58" rx="2" ry="1" fill="#FEF3C7" />
    <ellipse cx="55" cy="52" rx="2" ry="1" fill="#FEF3C7" />
    <ellipse cx="70" cy="56" rx="2" ry="1" fill="#FEF3C7" />

    <!-- Cesta de papas fritas doradas -->
    <path d="M 95 70 L 140 70 L 132 105 L 103 105 Z" fill="#0C0A09" stroke="#78716C" stroke-width="1.5" />
    <rect x="100" y="45" width="5" height="30" rx="2" fill="#FBBF24" transform="rotate(-10 100 45)" />
    <rect x="110" y="40" width="5" height="35" rx="2" fill="#F59E0B" />
    <rect x="120" y="44" width="5" height="32" rx="2" fill="#FBBF24" transform="rotate(8 120 44)" />
    <rect x="128" y="48" width="5" height="28" rx="2" fill="#D97706" transform="rotate(15 128 48)" />
  </g>

  <!-- Objeto Principal: Stand de Tablet POS Blanco Moderno (Perspectiva POV) -->
  <g transform="translate(230, 110)">
    <!-- Sombra del soporte de tablet -->
    <ellipse cx="140" cy="270" rx="90" ry="20" fill="#000000" opacity="0.4" />

    <!-- Soporte metálico blanco del POS -->
    <path d="M 130 200 L 150 200 L 160 265 L 120 265 Z" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5" />
    <ellipse cx="140" cy="265" rx="45" ry="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2" />

    <!-- Marco de la Tablet (Pantalla inclinada) -->
    <rect x="20" y="30" width="240" height="175" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="3" filter="drop-shadow(0 15px 30px rgba(0,0,0,0.5))" />
    <!-- Pantalla táctil activa con UI de NEGOVA -->
    <rect x="30" y="40" width="220" height="155" rx="10" fill="url(#screen-pos)" />

    <!-- UI: Header de la App NEGOVA POS -->
    <rect x="30" y="40" width="220" height="26" rx="6" fill="#0B0E14" />
    <circle cx="45" cy="53" r="5" fill="#ED500A" />
    <text x="56" y="56" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">NEGOVA REST</text>
    <rect x="175" y="46" width="65" height="14" rx="4" fill="#ED500A" />
    <text x="207" y="56" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">MESA 04 · S/ 54.00</text>

    <!-- UI: Grid de Tarjetas de Menú de Restaurante -->
    <!-- Item 1: Burger -->
    <rect x="40" y="74" width="62" height="42" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <circle cx="56" cy="90" r="8" fill="#ED500A" />
    <rect x="44" y="104" width="40" height="4" rx="2" fill="#FFFFFF" />
    <rect x="44" y="110" width="24" height="3" rx="1.5" fill="#94A3B8" />

    <!-- Item 2: Bebidas -->
    <rect x="109" y="74" width="62" height="42" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <circle cx="125" cy="90" r="8" fill="#F59E0B" />
    <rect x="113" y="104" width="35" height="4" rx="2" fill="#FFFFFF" />
    <rect x="113" y="110" width="20" height="3" rx="1.5" fill="#94A3B8" />

    <!-- Item 3: Postre -->
    <rect x="178" y="74" width="62" height="42" rx="6" fill="#1E293B" stroke="#ED500A" stroke-width="1.5" />
    <circle cx="194" cy="90" r="8" fill="#10B981" />
    <rect x="182" y="104" width="42" height="4" rx="2" fill="#FFFFFF" />
    <rect x="182" y="110" width="28" height="3" rx="1.5" fill="#ED500A" />

    <!-- UI: Botón de cobro rápido -->
    <rect x="40" y="125" width="200" height="26" rx="8" fill="#ED500A" />
    <text x="140" y="142" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">ENVIAR A COCINA & COBRAR</text>

    <!-- Indicador de señal en vivo -->
    <circle cx="238" cy="182" r="4" fill="#10B981" />
    <text x="230" y="185" fill="#94A3B8" font-family="monospace" font-size="8" text-anchor="end">Sincronizado</text>
  </g>

  <!-- Mano del Operador en primer plano (First-person POV interactuando) -->
  <g transform="translate(440, 220)">
    <!-- Brazo / Manga oscura -->
    <path d="M 70 230 L 160 230 L 120 130 L 50 150 Z" fill="#0B0E14" />
    <!-- Muñeca y mano con tono de piel realista -->
    <path d="M 55 145 C 50 120, 10 110, -10 100 C -25 95, -35 110, -20 125 C 0 140, 30 160, 60 170 Z" fill="#FBCFE8" opacity="0.9" />
    <!-- Dedo índice tocando la pantalla -->
    <path d="M -10 100 C -25 92, -45 90, -50 98 C -55 106, -35 115, -15 118 Z" fill="#FBCFE8" stroke="#E2E8F0" stroke-width="0.5" />
    <!-- Destello de toque táctil interactivo en la pantalla -->
    <circle cx="395" cy="325" r="14" fill="#ED500A" opacity="0.3" />
    <circle cx="395" cy="325" r="6" fill="#FFFFFF" opacity="0.8" />
  </g>

  <!-- Taza de Café Espresso en la esquina superior derecha del mostrador -->
  <g transform="translate(500, 235)">
    <ellipse cx="30" cy="40" rx="22" ry="7" fill="#000000" opacity="0.3" />
    <ellipse cx="30" cy="36" rx="18" ry="6" fill="#F8FAFC" />
    <ellipse cx="30" cy="34" rx="14" ry="4" fill="#451A03" />
    <!-- Vapor suave -->
    <path d="M 28 28 Q 25 18 30 10" stroke="#FFFFFF" stroke-width="1.5" fill="none" opacity="0.4" stroke-linecap="round" />
  </g>
</svg>
