<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="merc-pov-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#110A1F" />
      <stop offset="60%" stop-color="#1E1236" />
      <stop offset="100%" stop-color="#0F081C" />
    </linearGradient>
    <radialGradient id="bokeh-purple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="bokeh-warm-m" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEF3C7" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="market-desk" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="50%" stop-color="#312E81" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="pos-scale-screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0E14" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
  </defs>

  <!-- Fondo: Pasillos de supermercado y mercado de abastos con bokeh y estanterías desenfocadas -->
  <rect width="600" height="450" fill="url(#merc-pov-bg)" />

  <!-- Bokeh y luces cálidas de supermercado -->
  <circle cx="100" cy="80" r="55" fill="url(#bokeh-purple)" />
  <circle cx="270" cy="50" r="35" fill="url(#bokeh-warm-m)" />
  <circle cx="490" cy="90" r="65" fill="url(#bokeh-purple)" />
  <circle cx="530" cy="40" r="28" fill="url(#bokeh-warm-m)" />

  <!-- Siluetas suaves de estanterías y canastas en el fondo desenfocado -->
  <line x1="60" y1="50" x2="220" y2="50" stroke="#8B5CF6" stroke-width="2" opacity="0.3" />
  <rect x="70" y="55" width="18" height="40" rx="3" fill="#EF4444" opacity="0.4" />
  <rect x="95" y="55" width="18" height="40" rx="3" fill="#10B981" opacity="0.3" />
  <rect x="120" y="55" width="18" height="40" rx="3" fill="#F59E0B" opacity="0.4" />
  <rect x="145" y="55" width="18" height="40" rx="3" fill="#3B82F6" opacity="0.3" />

  <!-- Mostrador de caja y pesaje en primer plano (Perspectiva POV) -->
  <path d="M 0 230 L 600 230 L 600 450 L 0 450 Z" fill="url(#market-desk)" />
  <line x1="0" y1="230" x2="600" y2="230" stroke="#8B5CF6" stroke-width="2" opacity="0.6" />
  <line x1="0" y1="234" x2="600" y2="234" stroke="#000000" stroke-width="2" opacity="0.5" />

  <!-- Objeto de apoyo: Balanza Digital con Frutas Frescas en el Mostrador (Foreground) -->
  <g transform="translate(40, 240)">
    <!-- Sombra de la balanza -->
    <ellipse cx="85" cy="140" rx="85" ry="22" fill="#000000" opacity="0.5" />

    <!-- Base de la balanza de acero inoxidable -->
    <rect x="10" y="70" width="150" height="45" rx="10" fill="#0B0E14" stroke="#334155" stroke-width="2" />
    <rect x="25" y="80" width="70" height="24" rx="4" fill="#030712" />
    <text x="60" y="96" fill="#8B5CF6" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">1.450 KG</text>

    <!-- Plato de pesaje superior -->
    <ellipse cx="85" cy="65" rx="75" ry="18" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2" />
    <ellipse cx="85" cy="63" rx="68" ry="14" fill="#E2E8F0" />

    <!-- Frutas frescas en la balanza -->
    <!-- Manzana Gala Roja -->
    <circle cx="65" cy="45" r="18" fill="#DC2626" stroke="#B91C1C" stroke-width="1" />
    <path d="M 65 28 C 65 24, 70 20, 72 18" stroke="#78350F" stroke-width="2" fill="none" />
    <path d="M 72 18 C 76 16, 78 18, 76 22 Z" fill="#10B981" />

    <!-- Naranja Valencia -->
    <circle cx="95" cy="42" r="19" fill="#F97316" stroke="#EA580C" stroke-width="1" />
    <circle cx="95" cy="28" r="2.5" fill="#C2410C" />

    <!-- Manzana Verde Granny Smith -->
    <circle cx="80" cy="35" r="15" fill="#84CC16" stroke="#65A30D" stroke-width="1" />
  </g>

  <!-- Objeto Principal: Pantalla POS Táctil de Supermercado (Perspectiva POV) -->
  <g transform="translate(240, 100)">
    <!-- Sombra del terminal POS -->
    <ellipse cx="140" cy="275" rx="90" ry="20" fill="#000000" opacity="0.4" />

    <!-- Soporte metálico blanco del terminal -->
    <path d="M 130 200 L 150 200 L 160 270 L 120 270 Z" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5" />
    <ellipse cx="140" cy="270" rx="45" ry="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2" />

    <!-- Marco del Terminal POS -->
    <rect x="20" y="30" width="240" height="175" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="3" filter="drop-shadow(0 15px 30px rgba(0,0,0,0.5))" />
    <rect x="30" y="40" width="220" height="155" rx="10" fill="url(#pos-scale-screen)" />

    <!-- UI: Header de la App NEGOVA Market -->
    <rect x="30" y="40" width="220" height="26" rx="6" fill="#0B0E14" />
    <circle cx="45" cy="53" r="5" fill="#8B5CF6" />
    <text x="56" y="56" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">NEGOVA MARKET</text>
    <rect x="165" y="46" width="75" height="14" rx="4" fill="#8B5CF6" />
    <text x="202" y="56" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">BALANZA CONECTADA</text>

    <!-- UI: Producto Pesable Activo en Pantalla -->
    <rect x="40" y="74" width="200" height="42" rx="6" fill="#1E293B" stroke="#8B5CF6" stroke-width="1.5" />
    <circle cx="56" cy="95" r="8" fill="#DC2626" />
    <text x="70" y="90" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="9" font-weight="bold">Manzana Gala Importada</text>
    <text x="70" y="103" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="8">1.450 kg × S/ 6.50/kg</text>
    <text x="230" y="98" fill="#8B5CF6" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="end">S/ 9.43</text>

    <!-- UI: Lista de ítems en carrito -->
    <rect x="40" y="122" width="200" height="24" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1" />
    <text x="50" y="137" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="8">Arroz Superior 5kg (1 un.)</text>
    <text x="230" y="137" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="8" font-weight="bold" text-anchor="end">S/ 24.00</text>

    <!-- UI: Botón Cobrar Total -->
    <rect x="40" y="154" width="200" height="26" rx="8" fill="#ED500A" />
    <text x="140" y="171" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">COBRAR TICKET · S/ 33.43</text>
  </g>

  <!-- Mano del Cajero interactuando (POV) -->
  <g transform="translate(440, 215)">
    <path d="M 70 235 L 160 235 L 120 135 L 50 155 Z" fill="#0B0E14" />
    <path d="M 55 150 C 50 125, 10 115, -10 105 C -25 100, -35 115, -20 130 C 0 145, 30 165, 60 175 Z" fill="#FBCFE8" opacity="0.9" />
    <path d="M -10 105 C -25 97, -45 95, -50 103 C -55 111, -35 120, -15 123 Z" fill="#FBCFE8" stroke="#E2E8F0" stroke-width="0.5" />
    <!-- Destello táctil violeta -->
    <circle cx="395" cy="320" r="14" fill="#8B5CF6" opacity="0.3" />
    <circle cx="395" cy="320" r="6" fill="#FFFFFF" opacity="0.8" />
  </g>
</svg>
